[package]
name = "mpegts-pacer"
description = "Transport-agnostic MPEG-TS constant-bitrate pacer for broadcast (IRD) egress."
authors = ["Thomas Drapier"]
repository = "https://github.com/tdrapier-wbd/mpegts-pacer"
license = "MIT OR Apache-2.0"
readme = "README.md"

version = "0.1.0"
edition = "2024"
rust-version = "1.85"

keywords = ["mpeg-ts", "broadcast", "cbr", "pcr", "pacing"]
categories = ["multimedia", "network-programming"]

[lib]
doctest = false

# Deliberately free of any moq-* / QUIC dependency: the crate is a pure MPEG-TS
# shaper. Keep the dependency set to the standard async + bytes toolbox.
[dependencies]
bytes = "1"
thiserror = "2"
# io-std and rt-multi-thread are for the binary rather than the library, which is
# generic over AsyncRead/AsyncWrite and never names a stream: the CLI pipes stdin to
# stdout, and it wants the read side off the thread that owns the output timer,
# because a multi-megabyte read landing there is wire jitter.
tokio = { version = "1.48", features = [
	"net",
	"time",
	"sync",
	"rt",
	"rt-multi-thread",
	"macros",
	"io-util",
	"io-std",
] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.48", features = ["full", "test-util"] }
